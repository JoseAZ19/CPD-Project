<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Apply Now - Clarke's Personal Development</title>
    <link rel="stylesheet" href="./CSS/style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/css/select2.min.css" rel="stylesheet" />
    <link rel="icon" type="image/png" sizes="32x32" href="Imagenes/Logo2.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/select2/4.0.13/js/select2.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css">
</head>
<body class="apply-page">
    <header>
        <div class="header-container">
            <a href="Index.html" class="logo-link">
                <img src="Imagenes/Logo1.png" alt="Personal Training Logo" class="logo">
            </a>
            
            <!-- Botón hamburguesa (solo móvil) -->
            <button class="menu-toggle" aria-label="Toggle menu">
                <span></span>
                <span></span>
                <span></span>
            </button>
            
            <nav class="nav-menu">
                <ul>
                    <li><a href="Index.html#Home">Home</a></li>
                    <li><a href="Index.html#Soccer">Soccer</a></li>
                    <li><a href="Index.html#Tutoring">Spanish Tutoring</a></li>
                    <li><a href="Index.html#Basketball">Basketball</a></li>
                    <li><a href="Index.html#Fitness">Fitness</a></li>
                    <li><a href="Index.html#About us">About us</a></li>
                    <li><a href="Index.html#Contact">Contact</a></li>
                    <li class="mobile-instagram">
                        <a href="https://www.instagram.com/clarkespersonaldevelopment/" target="_blank">
                            <i class="fab fa-instagram"></i> Instagram
                        </a>
                    </li>
                </ul>
            </nav>
            <a href="https://www.instagram.com/clarkespersonaldevelopment/" class="instagram-btn desktop-instagram" target="_blank">
                <i class="fab fa-instagram"></i>
            </a>
        </div>
        <!-- Overlay para cerrar menú -->
        <div class="menu-overlay"></div>
    </header>
    <section class="apply section">
        <h2 class="text-animate">Apply Now</h2>
        <form action="https://formspree.io/f/xblrgnnz" method="POST" class="application-form text-animate">
            <input type="hidden" name="_subject" value="Soccer - New Application">
            <input type="hidden" name="_status" value="new">
            <div class="form-row">
                <div class="form-group">
                    <label for="full-name">Full name *</label>
                    <input type="text" id="full-name" name="full-name" required placeholder="Player full name">
                </div>
                <div class="form-group">
                    <label for="email">Email *</label>
                    <input type="email" id="email" name="email" required placeholder="your@email.com">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="mobile-number">Mobile number *</label>
                    <input type="tel" id="mobile-number" name="mobile-number" required placeholder="(757) 000-0000">
                </div>
                <div class="form-group">
                    <label for="dob">Date of birth *</label>
                    <input type="date" id="dob" name="dob" required>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="address">Address *</label>
                    <input type="text" id="address" name="address" required placeholder="Street, city, state">
                </div>
                <div class="form-group">
                    <label for="nationality">Nationality *</label>
                    <input type="text" id="nationality" name="nationality" required placeholder="Nationality">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="height">Height *</label>
                    <input type="text" id="height" name="height" required placeholder="e.g. 5'8&quot; or 173 cm">
                </div>
                <div class="form-group">
                    <label for="weight">Weight *</label>
                    <input type="text" id="weight" name="weight" required placeholder="e.g. 150 lb or 68 kg">
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="dominant-foot">Dominant foot *</label>
                    <select id="dominant-foot" name="dominant-foot" required>
                        <option value="">Select...</option>
                        <option value="right">Right</option>
                        <option value="left">Left</option>
                        <option value="both">Both</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="position">Position *</label>
                    <select id="position" name="position" required>
                        <option value="">Select position...</option>
                        <option value="goalkeeper">Goalkeeper</option>
                        <option value="center-back">Center Back</option>
                        <option value="left-back">Left Back</option>
                        <option value="right-back">Right Back</option>
                        <option value="defensive-midfielder">Defensive Midfielder</option>
                        <option value="central-midfielder">Central Midfielder</option>
                        <option value="attacking-midfielder">Attacking Midfielder</option>
                        <option value="left-winger">Left Winger</option>
                        <option value="right-winger">Right Winger</option>
                        <option value="forward">Forward / Striker</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="program">Program *</label>
                    <select id="program" name="program" required>
                        <option value="">Select program...</option>
                        <option value="group-sessions">Group Sessions</option>
                        <option value="private-1-on-1">Private 1-on-1 Sessions</option>
                        <option value="semi-private">Semi-private Sessions (2-4 players)</option>
                        <option value="technical-skills">Technical Skills Program</option>
                        <option value="strength-conditioning">Strength & Conditioning</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="tshirt-size">T-shirt size *</label>
                    <select id="tshirt-size" name="tshirt-size" required>
                        <option value="">Select...</option>
                        <option value="XS">XS</option>
                        <option value="S">S</option>
                        <option value="M">M</option>
                        <option value="L">L</option>
                        <option value="XL">XL</option>
                    </select>
                </div>
            </div>
            <div class="form-row">
                <div class="form-group">
                    <label for="instagram">Instagram</label>
                    <input type="text" id="instagram" name="instagram" placeholder="@username">
                </div>
                <div class="form-group">
                    <label for="commitment">Commitment level *</label>
                    <select id="commitment" name="commitment" required>
                        <option value="">Select...</option>
                        <option value="low">Low</option>
                        <option value="medium">Medium</option>
                        <option value="high">High</option>
                    </select>
                </div>
            </div>
            <div class="form-group" style="width: 100%;">
                <label for="history">History</label>
                <textarea id="history" name="history" required placeholder="Soccer background, injuries, and goals..."></textarea>
            </div>
            <button type="submit">Submit Application</button>
        </form>
    </section>
    <footer>
        <p>&copy; 2026 Personal Training. All rights reserved.</p>
    </footer>
    <script src="Script.js"></script>
</body>
</html>
